name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          cache: "true"

      - name: Run tests
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          cache: "true"

      - name: Run lint checks
        run: |
          pnpm install --frozen-lockfile
          pnpm run lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          cache: "true"

      - name: Run type checks
        run: |
          pnpm install --frozen-lockfile
          pnpm run typecheck

  check-mcpb:
    name: MCPB Manifest Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          cache: "true"

      - name: Validate manifest.json
        run: |
          pnpm install --frozen-lockfile
          pnpm run check:mcpb

  license-check:
    name: Dependency License Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up pnpm
        uses: ./.github/actions/setup-pnpm
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}
          cache: "true"

      - name: Analyze unconfirmed licenses
        run: |
          pnpm install --frozen-lockfile
          pnpm run license:analyze

  build-container-image-test:
    name: Build Container Image Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Takumi Guard
        id: takumi-guard
        uses: ./.github/actions/takumi-guard-token
        with:
          bot-id: ${{ vars.TAKUMI_GUARD_BOT_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v6
        with:
          context: .
          file: ./Dockerfile
          platforms: "linux/amd64,linux/arm64"
          push: false
          secrets: |
            npm_auth=${{ steps.takumi-guard.outputs.token }}
        env:
          DOCKER_BUILD_SUMMARY: false
