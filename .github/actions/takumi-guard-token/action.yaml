name: takumi-guard-token
description: Authenticate to the Takumi Guard npm registry and return a validated token
# This action assumes the following things:
# - granted `id-token: write` permission (required by Takumi Guard OIDC authentication)
# Side effects:
# - The token is stored outside the checkout and exposed to later steps in the job.
# - With `set-registry: "false"` (the default here) the default registry is left to the caller.
# An empty `bot-id` exits 0 in anonymous mode, so the token is validated below.

inputs:
  bot-id:
    description: "Takumi Guard bot ID"
    required: true
  set-registry:
    description: "Whether to point the default npm registry at Takumi Guard (true/false)"
    default: "false"

outputs:
  token:
    description: "Takumi Guard npm token, guaranteed non-empty"
    value: ${{ steps.takumi-guard.outputs.token }}
  registry-url:
    description: "Takumi Guard npm registry URL"
    value: ${{ steps.takumi-guard.outputs.registry-url }}

runs:
  using: composite
  steps:
    - id: takumi-guard
      uses: flatt-security/setup-takumi-guard-npm@14f07d0cbc739b42a1b7c70a04c2b84cd1318ddd # v1.4.0
      with:
        bot-id: ${{ inputs.bot-id }}
        set-registry: ${{ inputs.set-registry }}

    - name: Validate Takumi Guard token
      shell: bash
      env:
        TAKUMI_GUARD_TOKEN: ${{ steps.takumi-guard.outputs.token }}
      run: |
        if [ -z "$TAKUMI_GUARD_TOKEN" ]; then
          echo "::error::Takumi Guard authentication failed. TAKUMI_GUARD_TOKEN is empty."
          exit 1
        fi
